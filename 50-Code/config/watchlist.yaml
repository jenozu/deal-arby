search_settings:
  currency: CAD
  max_results_per_search: 50
  prefer_exact_model_matches: true
  include_used_items: true
  include_auctions: false
  include_fixed_price: true
  include_local_pickup: true
  global_max_source_price: 150.00

listing_filters:
  exclude_global_terms: ["for parts", "parts only", "not working", broken, damaged, untested, replica, fake, clone, inspired, "read description"]
  minimum_title_length: 8
  require_price: true
  require_title: true
  require_model_number: false

source_priority:
  - source: ebay
    enabled: true
    priority: 1
  - source: facebook_marketplace
    enabled: false
    priority: 2
  - source: kijiji
    enabled: false
    priority: 3
  - source: retail_clearance
    enabled: false
    priority: 4

discovery:
  enable_unknown_product_discovery: false
  enable_trending_product_discovery: false
  enable_category_wide_search: false
